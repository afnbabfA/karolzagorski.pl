<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>UMW Scaler</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1f21; --muted:#5f6368; --card:#ffffff; --line:#dadce0; --accent:#0b6e4f; --warn:#8a4b00; --warnbg:#fff4e0; --shade:rgba(0,0,0,.55); }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181a; --fg:#e8eaed; --muted:#9aa0a6; --card:#1f2225; --line:#3c4043; --accent:#4cc38a; --warn:#ffcc80; --warnbg:#3a2a10; --shade:rgba(0,0,0,.7); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin: 0 0 2px; font-size: 26px; } .sub { color: var(--muted); margin: 0 0 14px; }
  .langs { font-size: 13px; } .langbtn { background:none; border:1px solid var(--line); color:var(--fg); padding:3px 8px; border-radius:5px; cursor:pointer; margin:0 0 0 4px; }
  .langbtn.on { background: var(--accent); color:#fff; border-color: var(--accent); }
  .ruo { background: var(--warnbg); color: var(--warn); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; } @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel, .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  label { display:block; font-size: 13px; color: var(--muted); margin-top: 10px; }
  input, select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 14px; }
  button.main { margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 14px; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .2s; } #barlabel { font-size: 13px; color: var(--muted); }
  canvas { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; } .card p { margin: 4px 0; } .big { font-size: 34px; font-weight: 700; color: var(--accent); }
  #results button { margin-top: 4px; padding: 8px 12px; border:0; border-radius:7px; background: var(--accent); color:#fff; cursor:pointer; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 160px; overflow: auto; margin-top: 10px; }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .center { max-width: 460px; margin: 12vh auto 0; }
  .overlay { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay[hidden], [hidden] { display: none !important; }
  .dialog { background: var(--card); border: 1px solid var(--line); border-radius: 12px; max-width: 680px; max-height: 88vh; overflow: auto; padding: 20px 22px; }
  .dialog h2 { margin-top: 0; font-size: 20px; } .dialog p { margin: 8px 0; } .dialog a { color: var(--accent); }
  .nav { display:flex; gap:4px; border-bottom:1px solid var(--line); margin: 4px 0 16px; }
  .navbtn { padding:9px 16px; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; background:none; color:var(--muted); cursor:pointer; font-size:15px; }
  .navbtn.on { background:var(--card); border-color:var(--line); color:var(--fg); font-weight:600; margin-bottom:-1px; }
  #formframe { width:100%; border:0; min-height:900px; display:block; }
  .drop { margin-top: 4px; border: 2px dashed var(--line); border-radius: 10px; padding: 16px 12px; text-align: center; cursor: pointer; font-size: 14px; color: var(--muted); }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--fg); background: var(--bg); }
  .dropname { margin-top: 6px; font-size: 13px; color: var(--fg); word-break: break-all; } .dropname.bad { color: #c5221f; }
  .conv h3 { margin: 18px 0 6px; font-size: 16px; } .conv h3:first-child { margin-top: 0; } .conv p, .conv li { font-size: 14px; }
  .conv pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre; }
  .conv table { border-collapse: collapse; font-size: 13px; } .conv td, .conv th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  .conv button { padding: 7px 12px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer; margin: 2px 6px 2px 0; }
  .err { color: #c5221f; font-size: 14px; min-height: 1.2em; } .status { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<!-- 1. hasło -->
<section id="gate" class="center panel">
  <div class="langs" style="text-align:right">Language: <button class="langbtn" data-lang="en">EN</button><button class="langbtn" data-lang="pl">PL</button></div>
  <h2 data-i18n="gate_title"></h2>
  <p data-i18n="gate_text"></p>
  <form id="gate_form">
    <label for="gate_pw" data-i18n="gate_pw"></label>
    <input id="gate_pw" type="password" autocomplete="current-password" required>
    <button id="gate_btn" class="main" type="submit" data-i18n="gate_btn"></button>
  </form>
  <p id="gate_err" class="err"></p><p id="gate_status" class="status"></p>
</section>

<!-- 2. obowiązkowa zgoda (bez zamykania) -->
<div id="consent" class="overlay" role="dialog" aria-modal="true" aria-labelledby="consent_title" hidden>
  <div class="dialog">
    <div class="langs" style="text-align:right"><button class="langbtn" data-lang="en">EN</button><button class="langbtn" data-lang="pl">PL</button></div>
    <h2 id="consent_title" data-i18n="modal_title"></h2>
    <div data-i18n-html="modal_html"></div>
    <button id="consent_btn" class="main" data-i18n="modal_btn"></button>
  </div>
</div>

<!-- 3. aplikacja -->
<main id="app" hidden>
  <header><h1>UMW Scaler</h1><div class="langs"><button class="langbtn" data-lang="en">EN</button><button class="langbtn" data-lang="pl">PL</button></div></header>
  <p class="sub" data-i18n="subtitle"></p>
  <div class="ruo" data-i18n-html="ruo"></div>
  <nav class="nav"><button class="navbtn on" data-view="scaler" data-i18n="nav_scaler"></button><button class="navbtn" data-view="form" data-i18n="nav_form"></button><button class="navbtn" data-view="convert" data-i18n="nav_convert"></button></nav>
  <section id="view-scaler">
  <div class="grid">
    <div class="panel">
      <label for="file" data-i18n="in_file"></label>
      <div id="drop" class="drop" tabindex="0"><span data-i18n="drop_text"></span>
        <input type="file" id="file" accept=".svs,.tif,.tiff,.btf,.tf8" hidden><div id="dropname" class="dropname"></div></div>
      <label for="url" data-i18n="in_url"></label>
      <input type="text" id="url" placeholder="testdata/....svs">
      <label for="mpp" data-i18n="in_mpp"></label>
      <input type="text" id="mpp" placeholder="0.25">
      <details open><summary data-i18n="clin"></summary>
        <label for="c_diam" data-i18n="c_diam"></label><input id="c_diam" inputmode="decimal">
        <label for="c_height" data-i18n="c_height"></label><input id="c_height" inputmode="decimal">
        <label for="c_age" data-i18n="c_age"></label><input id="c_age" inputmode="decimal">
        <label for="c_extra" data-i18n="c_extra"></label><select id="c_extra"><option value="" data-i18n="unknown"></option><option value="0" data-i18n="no"></option><option value="1" data-i18n="yes"></option></select>
        <label for="c_bap1" data-i18n="c_bap1"></label><select id="c_bap1"><option value="" data-i18n="unknown"></option><option value="0" data-i18n="no"></option><option value="1" data-i18n="yes"></option></select>
      </details>
      <button id="run" class="main" disabled data-i18n="run"></button>
      <div class="progress"><div id="bar"></div></div><div id="barlabel" data-i18n="loading"></div>
      <div id="log"></div>
    </div>
    <div>
      <canvas id="thumb" width="900" height="500"></canvas>
      <div id="results"></div>
    </div>
  </div>
  <details><summary data-i18n="how_title"></summary><div data-i18n-html="how_html"></div></details>
  </section>
  <section id="view-convert" class="panel conv" hidden><div data-i18n-html="conv_html"></div></section>
  <section id="view-form" hidden>
    <p class="status" data-i18n="nav_form_note"></p>
    <iframe id="formframe" title="Validation data form"></iframe>
  </section>
</main>
<script src="vendor/tf.min.js"></script>
<script src="vendor/tf-backend-webgpu.min.js"></script>
<script src="vendor/geotiff.js"></script>
<script src="i18n.js"></script>
<script src="gate.js"></script>
</body>
</html>
